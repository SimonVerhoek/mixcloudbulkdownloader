version: '3.7'

services:
  app-windows:
    # uncomment when working on a M1 machine locally
    # platform: linux/amd64
    image: ghcr.io/tkgmomosheep/docker-pyinstaller:master-py3-win64
    container_name: MBD-windows
    volumes:
      - .:/src
    environment:
      - SENTRY_DSN
      - LICENSE_SERVER_URL
      - STRIPE_CHECKOUT_URI
      - USER_FEEDBACK_BEARER_TOKEN
      - BUILD_ENV=prod
