[tool.poetry]
name = "mixcloud-bulk-downloader"
version = "3.3.0a1"
description = "Download for FREE all cloudcasts of your favorite Mixcloud artist at one go!"
authors = ["Simon Verhoek <contact+mixcloudbulkdownloader@simonverhoek.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "3.11.5"
yt-dlp = "^2026.7.4"
httpx = "^0.28.1"
pyside6 = "^6.8.3"
environs = "^15.1.0"
packaging = "^25.0"
httpcore = "1.0.9"
marshmallow = "4.1.2"
cryptography = "^50.0.0"
sentry-sdk = "^2.61.1"
idna = "^3.18"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"
pyinstaller = "^6.21.0"
setuptools = "^83.0.0"
filelock = "^3.24.3"
virtualenv = "^21.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
pytest-qt = "^4.5.0"
pytest-mock = "^3.15.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"

[tool.poetry.group.ci.dependencies]
pytest-xvfb = "^3.1.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 100
target-version = ['py311']
exclude = ""
