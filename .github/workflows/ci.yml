name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  check-requirements:
    name: Check requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install poetry-plugin-export
        run: poetry self add poetry-plugin-export

      - name: Check requirements.txt matches poetry.lock
        run: bash scripts/check_requirements_export.sh

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xkb1 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxrender1 \
            libxi6 \
            xvfb \
            x11-utils \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install poetry==2.4.1
          poetry config virtualenvs.create false
          poetry install --with=test,linux --without dev

      - name: Run tests
        run: pytest -m "not windows and not macos"

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      KEYRING_PROPERTY_TRUST_REPO: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install Python dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with=test --without dev

      - name: Run tests
        run: poetry run pytest -m "not qt" --tb=short -v

  build-windows:
    name: Build (Windows, unsigned)
    runs-on: windows-latest
    needs: test-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Poetry and dependencies
        run: |
          pip install poetry==2.4.1
          poetry config virtualenvs.create false
          poetry install --with dev --without test

      - name: Ensure unzip is available
        shell: pwsh
        run: |
          if (-not (Get-Command unzip -ErrorAction SilentlyContinue)) {
            choco install unzip -y
          }

      - name: Download FFmpeg binaries
        shell: bash
        run: bash scripts/download_ffmpeg.sh

      - name: Create .env.prod
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
          STRIPE_CHECKOUT_URI: ${{ secrets.STRIPE_CHECKOUT_URI }}
          USER_FEEDBACK_BEARER_TOKEN: ${{ secrets.USER_FEEDBACK_BEARER_TOKEN }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env.prod
          printf 'LICENSE_SERVER_URL=%s\n' "$LICENSE_SERVER_URL" >> .env.prod
          printf 'STRIPE_CHECKOUT_URI=%s\n' "$STRIPE_CHECKOUT_URI" >> .env.prod
          printf 'USER_FEEDBACK_BEARER_TOKEN=%s\n' "$USER_FEEDBACK_BEARER_TOKEN" >> .env.prod
          echo 'DEBUG=False' >> .env.prod
          echo 'CONSOLE=False' >> .env.prod
          echo 'DEVELOPMENT=False' >> .env.prod

      - name: Build with PyInstaller
        env:
          BUILD_ENV: prod
        run: pyinstaller --clean -y --log-level INFO app.spec

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(grep '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create ZIP artifact
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist\Mixcloud Bulk Downloader\*" `
            -DestinationPath "Mixcloud_Bulk_Downloader_${version}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "Mixcloud_Bulk_Downloader_*.zip"
          retention-days: 7

  build-macos-silicon:
    name: Build (macOS Silicon, ad-hoc signed)
    runs-on: macos-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Homebrew dependencies
        run: brew install openssl@3 create-dmg

      - name: Install Poetry and Python dependencies
        run: |
          pip install poetry==2.4.1
          poetry config virtualenvs.create false
          poetry install --with dev --without test

      - name: Download FFmpeg binaries
        run: bash scripts/download_ffmpeg.sh

      - name: Create .env.prod (ad-hoc signing)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
          STRIPE_CHECKOUT_URI: ${{ secrets.STRIPE_CHECKOUT_URI }}
          USER_FEEDBACK_BEARER_TOKEN: ${{ secrets.USER_FEEDBACK_BEARER_TOKEN }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env.prod
          printf 'LICENSE_SERVER_URL=%s\n' "$LICENSE_SERVER_URL" >> .env.prod
          printf 'STRIPE_CHECKOUT_URI=%s\n' "$STRIPE_CHECKOUT_URI" >> .env.prod
          printf 'USER_FEEDBACK_BEARER_TOKEN=%s\n' "$USER_FEEDBACK_BEARER_TOKEN" >> .env.prod
          echo 'APPLE_DEVELOPER_ID=-' >> .env.prod
          echo 'DEBUG=False' >> .env.prod
          echo 'CONSOLE=False' >> .env.prod
          echo 'DEVELOPMENT=False' >> .env.prod

      - name: Build with PyInstaller
        env:
          BUILD_ENV: prod
        run: pyinstaller --clean -y --log-level INFO app.spec

      - name: Get version
        id: version
        run: echo "version=$(grep '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          create-dmg \
            --app-drop-link 0 35 \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_arm64.dmg" \
            "dist/Mixcloud Bulk Downloader.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon-build
          path: "Mixcloud_Bulk_Downloader_*_arm64.dmg"
          retention-days: 7

  build-macos-intel:
    name: Build (macOS Intel, ad-hoc signed)
    runs-on: macos-15-intel
    needs: test-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Homebrew dependencies
        run: brew install openssl@3 create-dmg

      - name: Set up isolated virtual environment
        run: |
          pip install --upgrade pip
          pip install poetry==2.4.1          # Install into tool-cached Python before project venv exists
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install virtualenv==21.7.1   # Pre-install into .venv; no conflict since poetry is in tool-cached Python
          poetry config virtualenvs.create false
          poetry install --with dev --without test

      - name: Download FFmpeg binaries
        run: bash scripts/download_ffmpeg.sh

      - name: Create .env.prod (ad-hoc signing)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
          STRIPE_CHECKOUT_URI: ${{ secrets.STRIPE_CHECKOUT_URI }}
          USER_FEEDBACK_BEARER_TOKEN: ${{ secrets.USER_FEEDBACK_BEARER_TOKEN }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env.prod
          printf 'LICENSE_SERVER_URL=%s\n' "$LICENSE_SERVER_URL" >> .env.prod
          printf 'STRIPE_CHECKOUT_URI=%s\n' "$STRIPE_CHECKOUT_URI" >> .env.prod
          printf 'USER_FEEDBACK_BEARER_TOKEN=%s\n' "$USER_FEEDBACK_BEARER_TOKEN" >> .env.prod
          echo 'APPLE_DEVELOPER_ID=-' >> .env.prod
          echo 'DEBUG=False' >> .env.prod
          echo 'CONSOLE=False' >> .env.prod
          echo 'DEVELOPMENT=False' >> .env.prod

      - name: Build with PyInstaller
        env:
          BUILD_ENV: prod
        run: pyinstaller --clean -y --log-level INFO app.spec

      - name: Get version
        id: version
        run: echo "version=$(grep '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          create-dmg \
            --app-drop-link 0 35 \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_x86_64.dmg" \
            "dist/Mixcloud Bulk Downloader.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: "Mixcloud_Bulk_Downloader_*_x86_64.dmg"
          retention-days: 7
