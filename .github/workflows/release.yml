name: Release

on:
  push:
    branches:
      - master

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xkb1 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxrender1 \
            libxi6 \
            xvfb \
            x11-utils \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install poetry==2.1.4
          poetry config virtualenvs.create false
          poetry install --with=test,ci --without dev

      - name: Run tests
        run: pytest -m "not windows and not macos"

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      KEYRING_PROPERTY_TRUST_REPO: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Poetry
        run: pip install poetry==2.1.4

      - name: Install Python dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --with=test --without dev,ci

      - name: Run tests
        run: poetry run pytest -m "not qt" --tb=short -v

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [test-linux, test-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Poetry and dependencies
        run: |
          pip install poetry==2.1.4
          poetry config virtualenvs.create false
          poetry install --with dev --without test,ci

      - name: Ensure unzip is available
        shell: pwsh
        run: |
          if (-not (Get-Command unzip -ErrorAction SilentlyContinue)) {
            choco install unzip -y
          }

      - name: Download FFmpeg binaries
        shell: bash
        run: bash scripts/download_ffmpeg.sh

      - name: Create .env.prod
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
          STRIPE_CHECKOUT_URI: ${{ secrets.STRIPE_CHECKOUT_URI }}
          USER_FEEDBACK_BEARER_TOKEN: ${{ secrets.USER_FEEDBACK_BEARER_TOKEN }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env.prod
          printf 'LICENSE_SERVER_URL=%s\n' "$LICENSE_SERVER_URL" >> .env.prod
          printf 'STRIPE_CHECKOUT_URI=%s\n' "$STRIPE_CHECKOUT_URI" >> .env.prod
          printf 'USER_FEEDBACK_BEARER_TOKEN=%s\n' "$USER_FEEDBACK_BEARER_TOKEN" >> .env.prod
          echo 'DEBUG=False' >> .env.prod
          echo 'CONSOLE=False' >> .env.prod
          echo 'DEVELOPMENT=False' >> .env.prod

      - name: Build with PyInstaller
        env:
          BUILD_ENV: prod
        run: pyinstaller --clean -y --log-level INFO app.spec

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(grep '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create ZIP artifact
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist\Mixcloud Bulk Downloader\*" `
            -DestinationPath "Mixcloud_Bulk_Downloader_${version}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "Mixcloud_Bulk_Downloader_*.zip"
          retention-days: 30

  build-macos-silicon:
    name: Build and notarize (macOS Silicon)
    runs-on: macos-latest
    needs: [test-linux, test-windows]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Homebrew dependencies
        run: brew install openssl@3 create-dmg

      - name: Install Poetry and Python dependencies
        run: |
          pip install poetry==2.1.4
          poetry config virtualenvs.create false
          poetry install --with dev --without test,ci

      - name: Download FFmpeg binaries
        run: bash scripts/download_ffmpeg.sh

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Create .env.prod
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
          STRIPE_CHECKOUT_URI: ${{ secrets.STRIPE_CHECKOUT_URI }}
          USER_FEEDBACK_BEARER_TOKEN: ${{ secrets.USER_FEEDBACK_BEARER_TOKEN }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env.prod
          printf 'LICENSE_SERVER_URL=%s\n' "$LICENSE_SERVER_URL" >> .env.prod
          printf 'STRIPE_CHECKOUT_URI=%s\n' "$STRIPE_CHECKOUT_URI" >> .env.prod
          printf 'USER_FEEDBACK_BEARER_TOKEN=%s\n' "$USER_FEEDBACK_BEARER_TOKEN" >> .env.prod
          printf 'APPLE_DEVELOPER_ID=%s\n' "$APPLE_DEVELOPER_ID" >> .env.prod
          echo 'DEBUG=False' >> .env.prod
          echo 'CONSOLE=False' >> .env.prod
          echo 'DEVELOPMENT=False' >> .env.prod

      - name: Build with PyInstaller
        env:
          BUILD_ENV: prod
        run: pyinstaller --clean -y --log-level INFO app.spec

      - name: Get version
        id: version
        run: echo "version=$(grep '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          create-dmg \
            --app-drop-link 0 35 \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_arm64.dmg" \
            "dist/Mixcloud Bulk Downloader.app"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > api_key.p8
          xcrun notarytool submit \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_arm64.dmg" \
            --key api_key.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER_ID" \
            --wait
          xcrun stapler staple \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_arm64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-silicon-build
          path: "Mixcloud_Bulk_Downloader_*_arm64.dmg"
          retention-days: 30

      - name: Cleanup keychain and API key
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f cert.p12 api_key.p8

  build-macos-intel:
    name: Build and notarize (macOS Intel)
    runs-on: macos-15-intel
    needs: [test-linux, test-windows]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"

      - name: Install Homebrew dependencies
        run: brew install openssl@3 create-dmg

      - name: Set up isolated virtual environment
        run: |
          pip install --upgrade pip
          pip install poetry==2.1.4          # Install into tool-cached Python before project venv exists
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install virtualenv==21.7.1   # Pre-install into .venv; no conflict since poetry is in tool-cached Python
          poetry config virtualenvs.create false
          poetry install --with dev --without test,ci

      - name: Download FFmpeg binaries
        run: bash scripts/download_ffmpeg.sh

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Create .env.prod
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
          STRIPE_CHECKOUT_URI: ${{ secrets.STRIPE_CHECKOUT_URI }}
          USER_FEEDBACK_BEARER_TOKEN: ${{ secrets.USER_FEEDBACK_BEARER_TOKEN }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env.prod
          printf 'LICENSE_SERVER_URL=%s\n' "$LICENSE_SERVER_URL" >> .env.prod
          printf 'STRIPE_CHECKOUT_URI=%s\n' "$STRIPE_CHECKOUT_URI" >> .env.prod
          printf 'USER_FEEDBACK_BEARER_TOKEN=%s\n' "$USER_FEEDBACK_BEARER_TOKEN" >> .env.prod
          printf 'APPLE_DEVELOPER_ID=%s\n' "$APPLE_DEVELOPER_ID" >> .env.prod
          echo 'DEBUG=False' >> .env.prod
          echo 'CONSOLE=False' >> .env.prod
          echo 'DEVELOPMENT=False' >> .env.prod

      - name: Build with PyInstaller
        env:
          BUILD_ENV: prod
        run: pyinstaller --clean -y --log-level INFO app.spec

      - name: Get version
        id: version
        run: echo "version=$(grep '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          create-dmg \
            --app-drop-link 0 35 \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_x86_64.dmg" \
            "dist/Mixcloud Bulk Downloader.app"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > api_key.p8
          xcrun notarytool submit \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_x86_64.dmg" \
            --key api_key.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER_ID" \
            --wait
          xcrun stapler staple \
            "Mixcloud_Bulk_Downloader_${{ steps.version.outputs.version }}_x86_64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-build
          path: "Mixcloud_Bulk_Downloader_*_x86_64.dmg"
          retention-days: 30

      - name: Cleanup keychain and API key
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f cert.p12 api_key.p8

  create-release:
    name: Create GitHub pre-release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos-silicon, build-macos-intel]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "version=$(grep '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')" \
            >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          prerelease: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
