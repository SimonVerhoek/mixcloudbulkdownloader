changelog:
  exclude:
    labels:
      - maintenance   # apply to CI, refactoring, docs PRs — hides them from changelog
  categories:
    - title: "New Features"
      labels:
        - enhancement
    - title: "Bug Fixes"
      labels:
        - bug
    - title: "Other Changes"
      labels:
        - "*"         # catch-all: any PR not matched above and not excluded
